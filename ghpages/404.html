<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FonteVita</title>
  <script>
    // Store the intended path and redirect to index
    var path = window.location.pathname;
    var base = '/remix-of-fontevita-your-wellness-source';
    if (path.startsWith(base)) {
      path = path.slice(base.length);
    }
    var full = path + window.location.search + window.location.hash;
    sessionStorage.setItem('spa-redirect', full);
    window.location.replace(base + '/');
  </script>
</head>
<body>
  <p>Перенаправление...</p>
</body>
</html>
