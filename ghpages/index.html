// Render quiz
window.renderQuiz && window.renderQuiz();

// Initial page render
(function() {
  // Show main page content
  const tpl = document.getElementById('main-page-content');
  const app = document.getElementById('app');
  if(tpl && app) {
    app.innerHTML = tpl.innerHTML;
    // Re-init scripts after DOM injection
    setTimeout(function() {
      // Header scroll
      const h = app.querySelector('.header');
      if(h) {
        const fn = () => h.classList.toggle('scrolled', window.scrollY > 12);
        window.addEventListener('scroll', fn, {passive:true});
        fn();
      }
      // Bottles
      const stage = app.querySelector('#bottles-stage');
      if(stage) {
        const items = stage.querySelectorAll('.bottle-item');
        const dots = app.querySelectorAll('.bottle-dot');
        let active=0, paused=false;
        function setActive(i) {
          active=i;
          items.forEach((el,idx) => {
            const offset=((idx-active+items.length)%items.length);
            el.style.transform=`translate(-50%,-50%) translateX(${offset===0?'0%':offset===1?'30%':'-30%'}) scale(${offset===0?1:.58}) rotateY(${offset===0?'0deg':offset===1?'6deg':'-6deg'})`;
            el.style.zIndex=offset===0?30:10;
          });
          dots.forEach((d,idx)=>d.classList.toggle('active',idx===active));
        }
        setInterval(()=>{if(!paused)setActive((active+1)%items.length)},4200);
        stage.parentElement.addEventListener('mouseenter',()=>paused=true);
        stage.parentElement.addEventListener('mouseleave',()=>paused=false);
        dots.forEach((d,i)=>d.addEventListener('click',()=>setActive(i)));
      }
      // Reveal
      const els = app.querySelectorAll('.reveal');
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}});
      },{threshold:.15});
      els.forEach(el=>io.observe(el));
      // FAQ
      app.querySelectorAll('.faq-item').forEach(item => {
        item.querySelector('.faq-question')?.addEventListener('click', () => item.classList.toggle('open'));
      });
      // Products grid
      const grid = app.querySelector('#products-grid');
      if(grid && !grid.children.length) {
        const products = window.PRODUCTS;
        const icons = window.icons;
        grid.innerHTML = products.map((p,i) => `
          <div class="product-card-wrap reveal" style="transition-delay:${i*110}ms">
            <article class="product-card" id="product-${p.id}">
              <span class="capsule-badge">${p.capsules}</span>
              <div class="product-img-wrap">
                <div class="bg-glow" aria-hidden="true"></div>
                <div class="bg-fade" aria-hidden="true"></div>
                <img src="${p.img}" alt="${p.name} FonteVita — ${p.capsules}" class="product-img animate-float" loading="lazy">
              </div>
              <div class="product-body">
                <h3 class="product-name">${p.name}</h3>
                <p class="product-tagline">${p.tagline}</p>
                <dl class="product-highlights">
                  ${p.highlights.map(h=>`<div class="highlight-item"><dt class="highlight-value">${h.v}</dt><dd class="highlight-label">${h.l}</dd></div>`).join('')}
                </dl>
                <button class="details-toggle" id="toggle-${p.id}" onclick="window._toggleDetails('${p.id}')">
                  Подробнее ${icons.chevDown}
                </button>
                <div class="product-details" id="details-${p.id}">
                  <div class="product-details-inner">
                    <div class="product-details-content">
                      <ul>${p.benefits.map(b=>`<li>${icons.check}<span>${b}</span></li>`).join('')}</ul>
                      <div class="dose-info">
                        <p><strong>Дозировка: </strong><span>${p.dose}</span></p>
                        <p><strong>Приём: </strong><span>${p.intake}</span></p>
                        <p><strong>Состав: </strong><span>${p.composition}</span></p>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="product-footer">
                  <div><span class="price-current">${window.formatPrice(p.price)}</span>${p.oldPrice?`<span class="price-old">${window.formatPrice(p.oldPrice)}</span>`:''}</div>
                  <div id="buy-wrap-${p.id}"><button class="buy-btn" onclick="window._addToCart('${p.id}', this)">${icons.shoppingBag} В корзину</button></div>
                </div>
              </div>
            </article>
          </div>
        `).join('');
        // Re-observe new reveal elements
        grid.querySelectorAll('.reveal').forEach(el=>io.observe(el));
      }
      // Quiz
      window.renderQuiz && window.renderQuiz();
      // Cart
      window.updateCartUI && window.updateCartUI();
      // Cart events
      app.querySelector('#cart-overlay')?.addEventListener('click', window._closeCart);
      app.querySelector('#cart-close')?.addEventListener('click', window._closeCart);
      app.querySelector('#cart-btn')?.addEventListener('click', window._openCart);
      app.querySelector('#checkout-btn')?.addEventListener('click', function(){alert('Заказ оформлен! Спасибо!')});
      // Mobile nav
      const menuBtn = app.querySelector('#menu-btn');
      const mobileNav = app.querySelector('#mobile-nav');
      const closeMenu = app.querySelector('#mobile-nav-close');
      if(menuBtn && mobileNav) menuBtn.addEventListener('click', () => mobileNav.classList.toggle('open'));
      if(closeMenu && mobileNav) closeMenu.addEventListener('click', () => mobileNav.classList.remove('open'));
      mobileNav?.querySelectorAll('.mobile-nav-link').forEach(a => a.addEventListener('click', () => mobileNav.classList.remove('open')));
      // SPA links - handle hash navigation for /#section links
      app.querySelectorAll('a[href^="/#"]').forEach(a => {
        a.addEventListener('click', function(e) {
          const hash = this.getAttribute('href').replace('/#','#');
          const currentPath = window.location.pathname;
          if(currentPath === '/' || currentPath === '') {
            e.preventDefault();
            const target = document.querySelector(hash);
            if(target) target.scrollIntoView({behavior:'smooth'});
          }
          // If on different page, let SPA navigate to / first, then hash will work
        });
      });
    }, 10);
  }

  // SPA routing - handle redirect from 404.html
  var redirect = sessionStorage.getItem('spa-redirect');
  if(redirect) {
    sessionStorage.removeItem('spa-redirect');
    window.history.replaceState({}, '', redirect);
  }
  window.addEventListener('popstate', function() { window._renderPage && window._renderPage(); });
  // Override SPA link clicks globally
  document.addEventListener('click', function(e) {
    const link = e.target.closest('a[data-spa]');
    if(!link) return;
    const href = link.getAttribute('href');
    if(!href || href.startsWith('http') || href.startsWith('#')) return;
    // Handle /#section links on main page
    if(href.startsWith('/#') && (window.location.pathname === '/' || window.location.pathname === '')) {
      e.preventDefault();
      const target = document.querySelector(href.replace('/#','#'));
      if(target) target.scrollIntoView({behavior:'smooth'});
      return;
    }
    e.preventDefault();
    window._navigate(href);
  });
})();
</script>
